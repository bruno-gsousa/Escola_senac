{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
    <h2>Welcome to the Login Page</h2>
    <p>Please log in to access your account.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
{% endblock %}
